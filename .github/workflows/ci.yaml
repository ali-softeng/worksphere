```yaml
name: WorkSphere CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, test and publish image
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name worksphere-ci-postgres \
            -e POSTGRES_USER=worksphere_ci \
            -e POSTGRES_PASSWORD=worksphere_ci \
            -e POSTGRES_DB=worksphere \
            -p 5432:5432 \
            --health-cmd="pg_isready -U worksphere_ci -d worksphere" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=10 \
            postgres:16

          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' worksphere-ci-postgres)

            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL is healthy"
              exit 0
            fi

            sleep 2
          done

          docker logs worksphere-ci-postgres
          echo "PostgreSQL failed to become healthy"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Maven
        env:
          DEV_DB_USERNAME: worksphere_ci
          DEV_DB_PASSWORD: worksphere_ci
          JWT_SECRET: ci-test-secret
        run: mvn clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-ssh-test:
    name: Test secure SSH connection
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_HOST_KEY: ${{ secrets.AZURE_VM_HOST_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/worksphere_deploy
          chmod 600 ~/.ssh/worksphere_deploy

          printf '%s %s\n' "$VM_HOST" "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "echo 'GitHub Actions SSH connection successful'"

  deploy:
    name: Deploy WorkSphere to Azure
    needs: [build, deploy-ssh-test]
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_HOST_KEY: ${{ secrets.AZURE_VM_HOST_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/worksphere_deploy
          chmod 600 ~/.ssh/worksphere_deploy

          printf '%s %s\n' "$VM_HOST" "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend image with automatic rollback
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'
          set -eu

          COMPOSE_FILE=/home/ali/worksphere-source/compose.yaml
          ENV_FILE=/etc/worksphere/worksphere.env
          EXPECTED_IMAGE=ghcr.io/ali-softeng/worksphere

          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: Invalid Docker image tag"
            exit 1
          fi

          export WORKSPHERE_IMAGE_TAG="$IMAGE_TAG"

          echo "Identifying the currently running backend..."

          CURRENT_CONTAINER=$(sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            ps -q backend)

          if [ -z "$CURRENT_CONTAINER" ]; then
            echo "ERROR: No current backend container found. Deployment stopped."
            exit 1
          fi

          CURRENT_IMAGE=$(sudo docker inspect \
            --format='{{.Config.Image}}' \
            "$CURRENT_CONTAINER")

          case "$CURRENT_IMAGE" in
            "$EXPECTED_IMAGE":*) ;;
            *)
              echo "ERROR: Current image does not match the expected WorkSphere image."
              echo "Found: $CURRENT_IMAGE"
              exit 1
              ;;
          esac

          PREVIOUS_TAG=${CURRENT_IMAGE##*:}

          if ! printf '%s' "$PREVIOUS_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: Previous image tag is not a valid commit SHA."
            echo "Found: $PREVIOUS_TAG"
            exit 1
          fi

          echo "Current image tag: $PREVIOUS_TAG"
          echo "Target image tag:  $IMAGE_TAG"

          check_health() {
            for i in $(seq 1 30); do
              if HEALTH_RESPONSE=$(curl -fsS http://localhost/actuator/health 2>/dev/null) \
                && printf '%s' "$HEALTH_RESPONSE" \
                  | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                return 0
              fi

              sleep 2
            done

            return 1
          }

          rollback() {
            echo "Restoring previous backend image: $PREVIOUS_TAG"

            export WORKSPHERE_IMAGE_TAG="$PREVIOUS_TAG"

            if ! sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              up -d --no-deps backend; then
              echo "ERROR: Rollback command failed."
              sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" \
                logs --tail=100 backend || true
              return 1
            fi

            echo "Verifying health after rollback..."

            if check_health; then
              echo "Rollback successful. Previous backend is healthy."
              return 0
            fi

            echo "ERROR: Previous backend did not pass the health check."
            sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              logs --tail=100 backend || true

            return 1
          }

          echo "Pulling the exact new backend image..."

          if ! sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            pull backend; then
            echo "ERROR: New image pull failed. Running backend was not intentionally changed."
            exit 1
          fi

          echo "Deploying the new backend image..."

          if ! sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d --no-deps backend; then
            echo "ERROR: Backend update command failed. Attempting rollback."

            if rollback; then
              echo "Previous release restored; this deployment failed."
            else
              echo "CRITICAL: Automatic rollback could not restore a healthy backend."
            fi

            exit 1
          fi

          echo "Checking the new backend health..."

          if check_health; then
            echo "SUCCESS: New WorkSphere backend is healthy."
            echo "Deployed image tag: $IMAGE_TAG"
            exit 0
          fi

          echo "ERROR: New backend failed its health check."

          sudo --preserve-env=WORKSPHERE_IMAGE_TAG docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            logs --tail=100 backend || true

          echo "Attempting automatic rollback..."

          if rollback; then
            echo "Previous release restored successfully."
            echo "GitHub Actions will still report this deployment as failed."
          else
            echo "CRITICAL: Rollback failed. Manual investigation is required."
          fi

          exit 1
          REMOTE_SCRIPT
```
