
name: WorkSphere CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, test and publish image
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name worksphere-ci-postgres \
            -e POSTGRES_USER=worksphere_ci \
            -e POSTGRES_PASSWORD=worksphere_ci \
            -e POSTGRES_DB=worksphere \
            -p 5432:5432 \
            --health-cmd="pg_isready -U worksphere_ci -d worksphere" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=10 \
            postgres:16

          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' worksphere-ci-postgres)

            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL is healthy"
              exit 0
            fi

            sleep 2
          done

          docker logs worksphere-ci-postgres
          echo "PostgreSQL failed to become healthy"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Maven
        env:
          DEV_DB_USERNAME: worksphere_ci
          DEV_DB_PASSWORD: worksphere_ci
          JWT_SECRET: ci-test-secret
        run: mvn clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-ssh-test:
    name: Test secure SSH connection
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_HOST_KEY: ${{ secrets.AZURE_VM_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/worksphere_deploy
          chmod 600 ~/.ssh/worksphere_deploy

          printf '%s %s\n' "$VM_HOST" "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -eu
          ssh \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "echo 'GitHub Actions SSH connection successful'"

  deploy:
    name: Deploy WorkSphere to Azure
    needs: [build, deploy-ssh-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_HOST_KEY: ${{ secrets.AZURE_VM_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/worksphere_deploy
          chmod 600 ~/.ssh/worksphere_deploy

          printf '%s %s\n' "$VM_HOST" "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment script to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -eu

          test -f scripts/deploy-azure.sh

          scp \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            scripts/deploy-azure.sh \
            "$VM_USER@$VM_HOST:/home/ali/deploy-azure.sh"

      - name: Diagnose deployment script on Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "nl -ba /home/ali/deploy-azure.sh | sed -n '115,125p'"

      - name: Run deployment script
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/worksphere_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VM_USER@$VM_HOST" \
            "chmod 700 /home/ali/deploy-azure.sh && bash -n /home/ali/deploy-azure.sh && IMAGE_TAG='$IMAGE_TAG' bash /home/ali/deploy-azure.sh"
