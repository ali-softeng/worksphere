
name: WorkSphere CI

on:
  push:
    branches:
      - main

jobs:
  build:
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name worksphere-ci-postgres \
            -e POSTGRES_USER=worksphere_ci \
            -e POSTGRES_PASSWORD=worksphere_ci \
            -e POSTGRES_DB=worksphere \
            -p 5432:5432 \
            --health-cmd="pg_isready -U worksphere_ci -d worksphere" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=10 \
            postgres:16

          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' worksphere-ci-postgres)
            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL is healthy"
              exit 0
            fi
            sleep 2
          done

          docker logs worksphere-ci-postgres
          echo "PostgreSQL failed to become healthy"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Maven
        env:
          DEV_DB_USERNAME: worksphere_ci
          DEV_DB_PASSWORD: worksphere_ci
          JWT_SECRET: ci-test-secret
        run: mvn clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}